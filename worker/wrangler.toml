name = "gofer"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"                    # Workers AI: no API key needed, billed to the Cloudflare account (free tier first)

[vars]
PAYPAL_ENV = "sandbox"            # sandbox | live
LLM_PROVIDER = "workers-ai"       # workers-ai | openai-compatible (then set LLM_BASE_URL + secret LLM_API_KEY)
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
LLM_BASE_URL = ""
CHANNEL3_BASE_URL = "https://api.trychannel3.com/v1"
PUBLIC_BASE_URL = "https://gofer.kbfoxtk.workers.dev"   # production; .dev.vars overrides locally
APP_RETURN_SCHEME = "gofer"
APNS_KEY_ID = "96B53G7L5Y"
APNS_TEAM_ID = "65SKN9BR9J"
APNS_TOPIC = "com.gofer.ios"
APNS_ENV = "sandbox"            # TestFlight and dev builds use the APNs sandbox      # gofer://paypal/return?token=...

# Secrets (never in this file). Local: worker/.dev.vars. Deployed: npm run secrets
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, CHANNEL3_API_KEY, APP_KEY, (optional) LLM_API_KEY, APNS_KEY (the .p8 contents)

[[d1_databases]]
binding = "DB"
database_name = "errand"
database_id = "8263ec6e-0017-461b-9fb1-8cf9f888914e"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]   # price watch
