name = "errand"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"                    # Workers AI: no API key needed, billed to the Cloudflare account (free tier first)

[vars]
PAYPAL_ENV = "sandbox"            # sandbox | live
LLM_PROVIDER = "workers-ai"       # workers-ai | openai-compatible (then set LLM_BASE_URL + secret LLM_API_KEY)
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
LLM_BASE_URL = ""
CHANNEL3_BASE_URL = "https://api.trychannel3.com/v1"
PUBLIC_BASE_URL = "http://localhost:8787"   # overridden after first deploy
APP_RETURN_SCHEME = "errand"      # errand://paypal/return?token=...

# Secrets (never in this file). Local: worker/.dev.vars. Deployed: npm run secrets
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, CHANNEL3_API_KEY, APP_KEY, (optional) LLM_API_KEY

# Week 2: persistence
# [[kv_namespaces]]
# binding = "KV"
# id = "..."
# [[d1_databases]]
# binding = "DB"
# database_name = "errand"
# database_id = "..."
# [triggers]
# crons = ["*/15 * * * *"]   # price watch
