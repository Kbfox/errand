name: Gofer
options:
  bundleIdPrefix: com.gofer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
settings:
  configs:
    Debug:
      API_BASE_URL: http://localhost:8787          # wrangler dev
    Release:
      API_BASE_URL: https://gofer.kbfoxtk.workers.dev
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 1.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gofer:
    type: application
    platform: iOS
    sources: [App, Views, Services, Models, Resources]
    entitlements:
      path: App/Gofer.entitlements
      properties:
        aps-environment: development   # xcodegen regenerates the file from these; without it the key is wiped and push registration is ignored
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gofer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true   # iPhone-only; App Store validation otherwise demands all four iPad orientations
        API_BASE_URL: $(API_BASE_URL)
        APP_KEY: $(APP_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.gofer.ios
            CFBundleURLSchemes: [gofer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gofer.ios
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only; xcodegen's target default is 1,2, which makes App Store demand iPad screenshots
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
