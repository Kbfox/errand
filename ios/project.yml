name: Gofer
options:
  bundleIdPrefix: com.gofer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
settings:
  configs:
    Debug:
      API_BASE_URL: http://localhost:8787          # wrangler dev
    Release:
      API_BASE_URL: https://gofer.kbfoxtk.workers.dev
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gofer:
    type: application
    platform: iOS
    sources: [App, Views, Services, Models, Resources]
    entitlements:
      path: App/Gofer.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gofer
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        API_BASE_URL: $(API_BASE_URL)
        APP_KEY: $(APP_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.gofer.ios
            CFBundleURLSchemes: [gofer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gofer.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
